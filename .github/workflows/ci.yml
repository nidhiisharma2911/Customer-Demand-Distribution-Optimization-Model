name: CI

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools & dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run scenario runner
        run: python -m src.run_scenarios

      - name: Execute analysis notebooks
        run: |
          jupyter nbconvert --to notebook --execute notebooks/demand_analysis.ipynb --output notebooks/demand_analysis_executed.ipynb --ExecutePreprocessor.timeout=120
          jupyter nbconvert --to notebook --execute notebooks/scenario_analysis.ipynb --output notebooks/scenario_analysis_executed.ipynb --ExecutePreprocessor.timeout=120

      - name: Run tests
        run: pytest -q
      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            outputs/**
            notebooks/demand_analysis_executed.ipynb
            notebooks/scenario_analysis_executed.ipynb
